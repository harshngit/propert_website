<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>You're offline | PropertySerch</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #111827; }
      main { max-width: 360px; padding: 24px; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #6b7280; line-height: 1.6; font-size: 15px; }
      button { margin-top: 16px; border: 0; border-radius: 10px; background: #e51c23; color: #fff; font-weight: 700; padding: 12px 20px; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pwa-192.png" alt="" />
      <h1>You're offline</h1>
      <p>PropertySerch needs a connection to show live listings and your dashboard. Check your network and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
